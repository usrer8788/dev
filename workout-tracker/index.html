<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Chalk Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column, scrolling view on top, fixed tab bar below, full-height sheets for a live workout. */
:root{
  --bg:#eceee9; --card:#f9faf7; --field:#e2e6df; --ink:#1c2422; --muted:#5b6864; --line:#d0d6cf;
  --accent:#e9a820; --on-accent:#1c2422; --accent-ink:#855600;
  --good:#2b7a4b; --good-bg:#d6ecdc; --bad:#b3372f;
  --p25:#c8372d; --p20:#2c5fb3; --p15:#e3b81f; --p10:#2f8a4d; --p5:#f1f1ec; --psm:#8c9692;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151c1a; --card:#1f2826; --field:#2a3532; --ink:#eef0e8; --muted:#9ba8a3; --line:#34413d;
  --accent:#f0b634; --on-accent:#1a1f1c; --accent-ink:#f0b634;
  --good:#6fcf97; --good-bg:#21392c; --bad:#ef7b72;
  --p25:#d9483e; --p20:#4a7fd6; --p15:#e9c234; --p10:#3fa463; --p5:#e8e8e2; --psm:#7d8884; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151c1a; --card:#1f2826; --field:#2a3532; --ink:#eef0e8; --muted:#9ba8a3; --line:#34413d;
  --accent:#f0b634; --on-accent:#1a1f1c; --accent-ink:#f0b634;
  --good:#6fcf97; --good-bg:#21392c; --bad:#ef7b72;
  --p25:#d9483e; --p20:#4a7fd6; --p15:#e9c234; --p10:#3fa463; --p5:#e8e8e2; --psm:#7d8884; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);font-variant-numeric:tabular-nums;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
#app{position:relative;height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;min-height:0;overflow-y:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:20px}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px} .row>.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}

.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
.tabs button{flex:1;padding:10px 4px 12px;text-align:center;font:600 15px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:6px;font-weight:600;background:var(--field);text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;color:var(--accent-ink)}
.btn.danger{background:none;color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
button.card{display:block;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{background:var(--card);padding:10px 12px}
.stats b{display:block;font:700 26px/1.1 var(--display)}
.pr{display:inline-block;background:var(--accent);color:var(--on-accent);font:700 12px var(--display);letter-spacing:.06em;padding:1px 6px;border-radius:3px;text-transform:uppercase}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:5px 12px;border-radius:99px;background:var(--field);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input.txt,textarea.txt,select.txt{width:100%;background:var(--field);border:1px solid transparent;border-radius:6px;padding:10px 12px;min-height:44px}
textarea.txt{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.list>button,.list>div{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);width:100%}
.list>:first-child{border-top:0}
.tick{width:22px;height:22px;border:2px solid var(--line);border-radius:5px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.on .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;color:var(--muted)}

.overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.overlay header{display:flex;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--card)}
.overlay header .title{flex:1;min-width:0;font:700 20px var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay .body{flex:1;min-height:0;overflow-y:auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
.overlay footer{padding-block:10px;border-top:1px solid var(--line);background:var(--card)}

.ex{display:flex;flex-direction:column;gap:6px}
.ex .name{font:700 20px var(--display);color:var(--accent-ink)}
.note{background:none;border:0;border-bottom:1px dashed var(--line);padding:4px 0;width:100%;font-size:14px}
.set{display:grid;gap:6px;align-items:center;padding:3px 0;border-radius:6px}
.g2{grid-template-columns:40px minmax(0,1fr) 68px 68px 44px}
.g1{grid-template-columns:40px minmax(0,1fr) 84px 44px}
.set.head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:center}
.set.done{background:var(--good-bg)}
.set input{width:100%;min-height:38px;text-align:center;background:var(--field);border:0;border-radius:5px;padding:4px;font-weight:600}
.set.done input{background:transparent}
.sn{height:38px;border-radius:5px;font:700 18px var(--display);text-align:center}
.sn.W{color:var(--accent-ink)} .sn.D{color:var(--p20)} .sn.F{color:var(--bad)}
.prev{font-size:14px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:38px}
.chk{height:38px;border-radius:5px;background:var(--field);text-align:center;font-weight:700;color:var(--muted)}
.done .chk{background:var(--good);color:var(--card)}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.bar{display:flex;align-items:center;gap:10px;padding-block:8px;background:var(--ink);color:var(--bg)}
.bar .btn{background:transparent;color:inherit;border:1px solid currentColor;min-height:36px;padding:4px 10px}
.bar b{font:700 24px var(--display)}
.bar.live{background:var(--card);color:var(--ink);border-top:1px solid var(--line)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--card);border-radius:12px 12px 0 0;padding-block:14px 18px;display:flex;flex-direction:column;gap:6px;max-height:80%;overflow-y:auto}
.sheet .btn{justify-content:flex-start}
svg text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal span{padding:6px 0;border-radius:5px}
.cal .hit{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal .dow{color:var(--muted);font-size:11px;text-transform:uppercase}
.plates{display:flex;align-items:center;justify-content:center;gap:2px;height:120px;overflow-x:auto}
.plates i{display:block;border-radius:3px;border:1px solid var(--line);flex:none}
.plates .shaft{width:60px;height:10px;background:var(--psm);border:0;border-radius:0}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

<div id="app"></div>

<script>
(() => {
'use strict';
const LS = 'chalklog.v1';
const MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Forearms','Full body','Cardio'];
const EQUIP = ['Barbell','Dumbbell','Machine','Cable','Bodyweight','Kettlebell','Band','Other'];
// [name, muscle, equipment, type]  type: wr weight×reps · bw reps only · dur time · cardio distance+time
const LIB = [
['Bench Press (Barbell)','Chest','Barbell','wr'],['Bench Press (Dumbbell)','Chest','Dumbbell','wr'],['Incline Bench Press (Barbell)','Chest','Barbell','wr'],
['Incline Bench Press (Dumbbell)','Chest','Dumbbell','wr'],['Chest Fly (Dumbbell)','Chest','Dumbbell','wr'],['Cable Crossover','Chest','Cable','wr'],
['Chest Press (Machine)','Chest','Machine','wr'],['Pec Deck','Chest','Machine','wr'],['Push Up','Chest','Bodyweight','bw'],['Chest Dip','Chest','Bodyweight','bw'],
['Deadlift (Barbell)','Back','Barbell','wr'],['Bent Over Row (Barbell)','Back','Barbell','wr'],['Dumbbell Row','Back','Dumbbell','wr'],['Lat Pulldown (Cable)','Back','Cable','wr'],
['Seated Cable Row','Back','Cable','wr'],['T-Bar Row','Back','Barbell','wr'],['Pull Up','Back','Bodyweight','bw'],['Chin Up','Back','Bodyweight','bw'],
['Back Extension','Back','Bodyweight','bw'],['Straight Arm Pulldown','Back','Cable','wr'],
['Overhead Press (Barbell)','Shoulders','Barbell','wr'],['Shoulder Press (Dumbbell)','Shoulders','Dumbbell','wr'],['Lateral Raise (Dumbbell)','Shoulders','Dumbbell','wr'],
['Lateral Raise (Cable)','Shoulders','Cable','wr'],['Front Raise (Dumbbell)','Shoulders','Dumbbell','wr'],['Reverse Fly (Dumbbell)','Shoulders','Dumbbell','wr'],
['Face Pull','Shoulders','Cable','wr'],['Shrug (Dumbbell)','Shoulders','Dumbbell','wr'],['Arnold Press','Shoulders','Dumbbell','wr'],
['Bicep Curl (Barbell)','Biceps','Barbell','wr'],['Bicep Curl (Dumbbell)','Biceps','Dumbbell','wr'],['Hammer Curl','Biceps','Dumbbell','wr'],
['Preacher Curl','Biceps','Machine','wr'],['Cable Curl','Biceps','Cable','wr'],['Incline Curl (Dumbbell)','Biceps','Dumbbell','wr'],
['Triceps Pushdown','Triceps','Cable','wr'],['Skull Crusher','Triceps','Barbell','wr'],['Overhead Triceps Extension','Triceps','Dumbbell','wr'],
['Close Grip Bench Press','Triceps','Barbell','wr'],['Triceps Dip','Triceps','Bodyweight','bw'],
['Squat (Barbell)','Quads','Barbell','wr'],['Front Squat','Quads','Barbell','wr'],['Leg Press','Quads','Machine','wr'],['Leg Extension','Quads','Machine','wr'],
['Bulgarian Split Squat','Quads','Dumbbell','wr'],['Goblet Squat','Quads','Kettlebell','wr'],['Lunge (Dumbbell)','Quads','Dumbbell','wr'],['Hack Squat','Quads','Machine','wr'],
['Romanian Deadlift','Hamstrings','Barbell','wr'],['Lying Leg Curl','Hamstrings','Machine','wr'],['Seated Leg Curl','Hamstrings','Machine','wr'],['Good Morning','Hamstrings','Barbell','wr'],
['Hip Thrust (Barbell)','Glutes','Barbell','wr'],['Glute Bridge','Glutes','Bodyweight','bw'],['Cable Kickback','Glutes','Cable','wr'],['Hip Abduction (Machine)','Glutes','Machine','wr'],
['Standing Calf Raise','Calves','Machine','wr'],['Seated Calf Raise','Calves','Machine','wr'],
['Plank','Core','Bodyweight','dur'],['Crunch','Core','Bodyweight','bw'],['Hanging Leg Raise','Core','Bodyweight','bw'],['Cable Crunch','Core','Cable','wr'],
['Russian Twist','Core','Bodyweight','bw'],['Ab Wheel Rollout','Core','Other','bw'],
['Wrist Curl','Forearms','Dumbbell','wr'],['Farmer Carry','Forearms','Dumbbell','dur'],
['Kettlebell Swing','Full body','Kettlebell','wr'],['Clean and Press','Full body','Barbell','wr'],['Burpee','Full body','Bodyweight','bw'],
['Running','Cardio','Other','cardio'],['Cycling','Cardio','Machine','cardio'],['Rowing Machine','Cardio','Machine','cardio'],['Jump Rope','Cardio','Other','dur'],
];
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KG = 2.2046226;

/* ---------- state ---------- */
const blank = () => ({settings:{unit:'kg',rest:90}, custom:[], routines:[], workouts:[], active:null});
let state = blank();
let EX = {};
const ui = {tab:'log', stack:[], sheet:null, rest:null, draft:null, q:'', muscle:'', sync:'local', cal:null};

function rebuildEX(){
  EX = {};
  for (const [name,muscle,equip,type] of LIB) EX[slug(name)] = {id:slug(name),name,muscle,equip,type};
  for (const c of state.custom) EX[c.id] = {...c, custom:true};
}
function starter(){
  const mk = (name, list) => ({id:uid(), name, exercises:list.map(([n,sets,reps]) => ({exId:slug(n), rest:null,
    sets:Array.from({length:sets}, () => ({type:'N', w:null, r:reps}))}))});
  return [
    mk('Push', [['Bench Press (Barbell)',3,8],['Overhead Press (Barbell)',3,8],['Incline Bench Press (Dumbbell)',3,10],['Lateral Raise (Dumbbell)',3,15],['Triceps Pushdown',3,12]]),
    mk('Pull', [['Deadlift (Barbell)',3,5],['Lat Pulldown (Cable)',3,10],['Seated Cable Row',3,10],['Face Pull',3,15],['Bicep Curl (Dumbbell)',3,12]]),
    mk('Legs', [['Squat (Barbell)',3,6],['Romanian Deadlift',3,8],['Leg Press',3,12],['Lying Leg Curl',3,12],['Standing Calf Raise',4,12]]),
  ];
}
function normalize(s){
  const b = blank();
  s = Object.assign(b, s || {});
  s.settings = Object.assign({unit:'kg',rest:90}, s.settings || {});
  for (const k of ['custom','routines','workouts']) if (!Array.isArray(s[k])) s[k] = [];
  s.workouts.sort((a,b) => b.start - a.start);
  return s;
}
function loadLocal(){
  try { const raw = localStorage.getItem(LS); if (raw) return normalize(JSON.parse(raw)); } catch(e){}
  return null;
}
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }

/* ---------- remote store (optional; the page works without it) ---------- */
let col = null; const dirty = new Set(); let flushing = false, flushT = 0;
const monthKey = t => { const d = new Date(t); return 'wm_' + d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
function docData(key){
  if (key === 'settings') return {settings:state.settings, custom:state.custom};
  if (key === 'routines') return {routines:state.routines};
  if (key === 'active') return {active:state.active};
  return {workouts:state.workouts.filter(w => monthKey(w.start) === key)};
}
function persist(...keys){
  saveLocal();
  if (!col) return;
  keys.forEach(k => dirty.add(k));
  clearTimeout(flushT); flushT = setTimeout(flush, 1200);
}
async function flush(){
  if (flushing || !col) return;
  flushing = true;
  try {
    while (dirty.size){
      const k = dirty.values().next().value; dirty.delete(k);
      await col.doc(k).set(JSON.parse(JSON.stringify(docData(k))));
    }
    setSync('cloud');
  } catch(e){ setSync('error'); }
  flushing = false;
}
function setSync(s){ if (ui.sync !== s){ ui.sync = s; if (ui.tab === 'progress' && !ui.stack.length) render(); } }
async function connect(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const c = db.collection('data/users/' + id);
    const snap = await c.get();
    col = c;
    if (snap.empty){ dirty.add('settings'); dirty.add('routines'); dirty.add('active'); state.workouts.forEach(w => dirty.add(monthKey(w.start))); flush(); return; }
    const next = blank(); const localActive = state.active;
    snap.docs.forEach(d => { const v = d.data() || {};
      if (d.id === 'settings'){ if (v.settings) next.settings = v.settings; if (v.custom) next.custom = v.custom; }
      else if (d.id === 'routines') next.routines = v.routines || [];
      else if (d.id === 'active') next.active = v.active || null;
      else if (d.id.startsWith('wm_')) next.workouts.push(...(v.workouts || []));
    });
    state = normalize(next);
    if (localActive){ state.active = localActive; dirty.add('active'); flush(); }
    rebuildEX(); saveLocal(); ui.sync = 'cloud';
    if (!ui.stack.length || top().type === 'active') render();
  } catch(e){ ui.sync = 'error'; }
}

/* ---------- formatting ---------- */
const unit = () => state.settings.unit;
const wd = kg => kg == null ? null : +((unit()==='lb' ? kg*KG : kg).toFixed(2));
const wk = v => unit()==='lb' ? v/KG : v;
const dd = km => km == null ? null : +((unit()==='lb' ? km*0.621371 : km).toFixed(2));
const dk = v => unit()==='lb' ? v/0.621371 : v;
const dunit = () => unit()==='lb' ? 'mi' : 'km';
const big = n => Math.round(n).toLocaleString();
const clock = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60); return m + ':' + String(s%60).padStart(2,'0'); };
const dur = ms => { const m = Math.round(ms/60000); return m < 60 ? m + ' min' : Math.floor(m/60) + 'h ' + String(m%60).padStart(2,'0') + 'm'; };
const day = t => new Date(t).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
const parseT = v => { v = String(v).trim(); if (!v) return null; if (v.includes(':')){ const [m,s] = v.split(':'); return (+m||0)*60 + (+s||0); } const n = parseFloat(v); return isNaN(n) ? null : n; };
const e1rm = (w,r) => r <= 1 ? w : w * (1 + r/30);
const setText = (s, type) => {
  if (type === 'wr') return (s.w != null ? wd(s.w) + ' ' + unit() : '–') + ' × ' + (s.r ?? '–');
  if (type === 'bw') return (s.r ?? '–') + ' reps';
  if (type === 'dur') return s.t != null ? clock(s.t) : '–';
  return (s.d != null ? dd(s.d) + ' ' + dunit() : '–') + ' · ' + (s.t != null ? clock(s.t) : '–');
};
const volume = w => w.exercises.reduce((a,e) => a + (EX[e.exId]?.type === 'wr' ? e.sets.reduce((b,s) => b + (s.type !== 'W' && s.w && s.r ? s.w*s.r : 0), 0) : 0), 0);
const setCount = w => w.exercises.reduce((a,e) => a + e.sets.filter(s => s.type !== 'W').length, 0);

/* ---------- history lookups ---------- */
function lastSets(exId){
  for (const w of state.workouts){ const e = w.exercises.find(e => e.exId === exId); if (e) return e.sets; }
  return null;
}
function bests(exId, before){
  const b = {w:0, e1:0, vol:0, r:0, t:0, d:0, n:0};
  for (const w of state.workouts){
    if (before != null && w.start >= before) continue;
    for (const e of w.exercises) if (e.exId === exId){ b.n++;
      for (const s of e.sets){ if (s.type === 'W') continue;
        if (s.w && s.r){ b.w = Math.max(b.w, s.w); b.e1 = Math.max(b.e1, e1rm(s.w, s.r)); b.vol = Math.max(b.vol, s.w*s.r); }
        if (s.r) b.r = Math.max(b.r, s.r);
        if (s.t) b.t = Math.max(b.t, s.t);
        if (s.d) b.d = Math.max(b.d, s.d);
      } }
  }
  return b;
}
function findPRs(w){
  const out = [];
  for (const e of w.exercises){
    const x = EX[e.exId]; if (!x) continue;
    const old = bests(e.exId, w.start); if (!old.n) continue;
    const now = {w:0,e1:0,vol:0,r:0,t:0,d:0};
    for (const s of e.sets){ if (s.type === 'W') continue;
      if (s.w && s.r){ now.w = Math.max(now.w,s.w); now.e1 = Math.max(now.e1,e1rm(s.w,s.r)); now.vol = Math.max(now.vol,s.w*s.r); }
      if (s.r) now.r = Math.max(now.r,s.r); if (s.t) now.t = Math.max(now.t,s.t); if (s.d) now.d = Math.max(now.d,s.d); }
    const add = (kind, val) => out.push({exId:e.exId, kind, val});
    if (x.type === 'wr'){ if (now.w > old.w) add('Heaviest weight', now.w); if (now.e1 > old.e1 + 1e-9) add('Best estimated 1RM', now.e1); if (now.vol > old.vol) add('Best set volume', now.vol); }
    if (x.type === 'bw' && now.r > old.r) add('Most reps', now.r);
    if (x.type === 'dur' && now.t > old.t) add('Longest time', now.t);
    if (x.type === 'cardio' && now.d > old.d) add('Longest distance', now.d);
  }
  return out;
}
const prText = p => p.kind === 'Most reps' ? p.val + ' reps' : p.kind === 'Longest time' ? clock(p.val) : p.kind === 'Longest distance' ? dd(p.val) + ' ' + dunit() : big(wd(p.val)) + ' ' + unit();

/* ---------- navigation ---------- */

/* ---------- workout lifecycle ---------- */
const newSet = (from) => ({type:'N', w:from?.w ?? null, r:from?.r ?? null, t:from?.t ?? null, d:from?.d ?? null, done:false});
function startWorkout(src){
  const go = () => {
    const hour = new Date().getHours();
    state.active = {name: src?.name || (hour < 12 ? 'Morning' : hour < 17 ? 'Afternoon' : 'Evening') + ' workout', start:Date.now(), routineId: src?.exercises && !src.start ? src.id : null, notes:'',
      exercises: (src?.exercises || []).filter(e => EX[e.exId]).map(e => ({exId:e.exId, note:'', rest:e.rest ?? null, sets:e.sets.map(s => ({...newSet(s), type:s.type || 'N'}))}))};
    ui.rest = null; persist('active'); ui.stack = [{type:'active'}]; render();
  };
  if (state.active) sheet('A workout is already in progress', [
    {label:'Resume it', fn(){ ui.stack = [{type:'active'}]; }},
    {label:'Discard it and start this one', danger:true, fn:go}, {label:'Cancel', fn(){}}]);
  else go();
}
function finishWorkout(){
  const a = state.active;
  const exercises = a.exercises.map(e => ({exId:e.exId, note:e.note || '', rest:e.rest ?? null,
    sets:e.sets.filter(s => s.done).map(({done, ...s}) => s)})).filter(e => e.sets.length);
  if (!exercises.length){ sheet('Tick at least one set before finishing', [{label:'Keep going', fn(){}}, {label:'Discard workout', danger:true, fn:discard}]); return; }
  const w = {id:uid(), name:a.name || 'Workout', start:a.start, end:Date.now(), notes:a.notes || '', exercises};
  w.prs = findPRs(w);
  state.workouts.unshift(w); state.workouts.sort((x,y) => y.start - x.start);
  const rid = a.routineId; state.active = null; ui.rest = null;
  persist('active', monthKey(w.start));
  ui.stack = [{type:'summary', id:w.id, rid}]; ui.tab = 'log'; render();
}
function discard(){ state.active = null; ui.rest = null; persist('active'); ui.stack = []; }
function startRest(sec){ if (!sec) return; ui.rest = {end:Date.now() + sec*1000, total:sec}; }
let actx;
function beep(){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(d => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.2, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d + .18); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + .2); });
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
}
setInterval(() => {
  const el = document.getElementById('elapsed'); if (el && state.active) el.textContent = clock((Date.now() - state.active.start)/1000);
  if (ui.rest){ const left = (ui.rest.end - Date.now())/1000;
    if (left <= 0){ ui.rest = null; beep(); render(); }
    else { const r = document.getElementById('restleft'); if (r) r.textContent = clock(left); } }
}, 500);

function bars(items){
  const max = Math.max(1, ...items.map(i => i.v)), W = 320, H = 130, bw = (W-10)/items.length;
  return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Weekly volume for the last ${items.length} weeks">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/><text x="0" y="10">${big(max)} ${unit()}</text>
    ${items.map((it,i) => { const h = it.v/max*(H-18); return `<rect x="${5+i*bw+2}" y="${H-h}" width="${bw-4}" height="${h}" rx="2" fill="${i===items.length-1 ? 'var(--accent)' : 'var(--muted)'}"/>${i%3===0 || i===items.length-1 ? `<text x="${5+i*bw+bw/2}" y="${H+13}" text-anchor="middle">${it.label}</text>` : ''}`; }).join('')}</svg>`;
}
function line(pts, fmt){
  if (pts.length < 2) return `<div class="empty small">Log this exercise in two sessions to see a trend.</div>`;
  const W = 320, H = 130, ys = pts.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys), span = hi-lo || 1;
  const X = i => 8 + i*(W-16)/(pts.length-1), Y = v => 22 + (1-(v-lo)/span)*(H-34);
  const d = pts.map((p,i) => (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const last = pts.length-1;
  return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Progress over ${pts.length} sessions">
    <line x1="0" y1="${Y(lo)}" x2="${W}" y2="${Y(lo)}" stroke="var(--line)"/><line x1="0" y1="${Y(hi)}" x2="${W}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="0" y="${Y(hi)-5}">${fmt(hi)}</text>${hi!==lo ? `<text x="0" y="${Y(lo)-5}">${fmt(lo)}</text>` : ''}
    <path d="${d}" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===last?4.5:2.5}" fill="${i===last?'var(--accent)':'var(--accent-ink)'}" stroke="var(--card)" stroke-width="${i===last?2:0}"/>`).join('')}
    <text x="8" y="${H+13}">${pts[0].x}</text><text x="${W-8}" y="${H+13}" text-anchor="end">${pts[last].x}</text></svg>`;
}
function viewProgress(){

  all.filter(w => w.start >= since).forEach(w => w.exercises.forEach(e => { const m = EX[e.exId]?.muscle; if (m) mus[m] = (mus[m]||0) + e.sets.filter(s => s.type!=='W').length; }));

    <div class="cal">${['M','T','W','T','F','S','S'].map(d => `<span class="dow">${d}</span>`).join('')}${'<span></span>'.repeat(lead)}${Array.from({length:days},(_,i) => `<span class="${hits.has(i+1)?'hit':''}">${i+1}</span>`).join('')}</div></div>

function setRow(ctx, ei, si, e, s, x, prev, n){
  const p = prev && prev[si], g = x.type === 'bw' || x.type === 'dur' ? 'g1' : 'g2';
  const inp = (k, val, ph) => `<input id="${ctx}-${ei}-${si}-${k}" inputmode="${k==='t'?'text':k==='r'?'numeric':'decimal'}" data-in="set" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" data-k="${k}" value="${val ?? ''}" placeholder="${ph ?? ''}" aria-label="${{w:'Weight',r:'Reps',t:'Time',d:'Distance'}[k]}">`;
  const fields = x.type === 'wr' ? inp('w', wd(s.w), p ? wd(p.w) : '') + inp('r', s.r, p?.r)
    : x.type === 'bw' ? inp('r', s.r, p?.r)
    : x.type === 'dur' ? inp('t', s.t != null ? clock(s.t) : '', p?.t != null ? clock(p.t) : '0:00')
    : inp('d', dd(s.d), p ? dd(p.d) : '') + inp('t', s.t != null ? clock(s.t) : '', p?.t != null ? clock(p.t) : '0:00');
  return `<div class="set ${g} ${s.done ? 'done' : ''}">
    <button class="sn ${s.type}" data-act="setMenu" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" aria-label="Set type and options">${s.type === 'N' ? n : s.type}</button>
    ${ctx === 'a' ? `<button class="prev" data-act="fillPrev" data-ei="${ei}" data-si="${si}" ${p ? '' : 'disabled'}>${p ? setText(p, x.type) : '–'}</button>` : `<span class="prev">${{N:'Normal',W:'Warm-up',D:'Drop set',F:'To failure'}[s.type]}</span>`}

}
function exBlock(ctx, e, ei){

    <div class="body pad"><h1>${esc(w.name)}</h1><span class="muted">Workout number ${state.workouts.length}</span>
    <div class="stats"><div><b>${dur(w.end-w.start)}</b><span class="small muted">duration</span></div><div><b>${big(wd(volume(w)))}</b><span class="small muted">${unit()} lifted</span></div><div><b>${setCount(w)}</b><span class="small muted">sets</span></div></div>
    ${r ? `<button class="btn wide" data-act="updateRoutine" data-id="${w.id}" data-rid="${r.id}">Update “${esc(r.name)}” with today's sets</button>` : `<button class="btn wide" data-act="saveAsRoutine" data-id="${w.id}">Save as a routine</button>`}
    ${workoutBody(w)}</div></div>`;
}
function ovExercise(o){
  const x = EX[o.id]; if (!x) return '';
  const b = bests(x.id), sessions = state.workouts.filter(w => w.exercises.some(e => e.exId === x.id));
  const metric = s => x.type==='wr' ? (s.w && s.r ? e1rm(s.w,s.r) : 0) : x.type==='bw' ? (s.r||0) : x.type==='dur' ? (s.t||0) : (s.d||0);
  const fmt = v => x.type==='wr' ? big(wd(v)) + ' ' + unit() : x.type==='bw' ? v + ' reps' : x.type==='dur' ? clock(v) : dd(v) + ' ' + dunit();
  const pts = sessions.slice().reverse().map(w => ({x:new Date(w.start).toLocaleDateString(undefined,{month:'short',day:'numeric'}),
    y:Math.max(0, ...w.exercises.filter(e => e.exId===x.id).flatMap(e => e.sets.filter(s => s.type!=='W').map(metric)))})).filter(p => p.y > 0);
  const recs = x.type==='wr' ? [['Heaviest weight', b.w ? big(wd(b.w))+' '+unit() : '–'],['Best estimated 1RM', b.e1 ? big(wd(b.e1))+' '+unit() : '–'],['Best set volume', b.vol ? big(wd(b.vol))+' '+unit() : '–']]
    : x.type==='bw' ? [['Most reps', b.r || '–']] : x.type==='dur' ? [['Longest time', b.t ? clock(b.t) : '–']] : [['Longest distance', b.d ? dd(b.d)+' '+dunit() : '–'],['Longest time', b.t ? clock(b.t) : '–']];
  return `<div class="overlay"><header class="pad"><button class="btn sm" data-act="back">‹ Back</button><span class="title">${esc(x.name)}</span>${x.custom ? `<button class="btn danger sm" data-act="delExercise" data-id="${x.id}">Delete</button>` : ''}</header>
    <div class="body pad"><span class="muted">${x.muscle} · ${x.equip} · ${sessions.length} session${sessions.length===1?'':'s'}</span>
    <div class="card col"><span class="label">Personal records</span>${recs.map(([k,v]) => `<div class="row between"><span>${k}</span><b>${v}</b></div>`).join('')}</div>
    <div class="card col"><span class="label">${{wr:'Estimated 1RM',bw:'Top set reps',dur:'Longest hold',cardio:'Distance'}[x.type]} per session</span>${line(pts, fmt)}</div>
    <span class="label">History</span>
    ${sessions.length ? sessions.map(w => `<div class="card col" style="gap:4px"><span class="small muted">${day(w.start)} · ${esc(w.name)}</span>${w.exercises.filter(e => e.exId===x.id).flatMap(e => e.sets).map(s => `<span class="small">${s.type==='N' ? '' : `<b class="sn ${s.type}" style="font-size:14px">${s.type}</b> `}${setText(s, x.type)}</span>`).join('')}</div>`).join('') : `<div class="empty">Not logged yet.</div>`}</div></div>`;
}
function ovNewEx(o){
  const sel = (id, opts, cur) => `<select class="txt" id="${id}" data-in="newex" data-k="${id.slice(3)}">${opts.map(([v,l]) => `<option value="${v}" ${v===cur?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="overlay"><header class="pad"><button class="btn sm" data-act="back">Cancel</button><span class="title">Custom exercise</span><button class="btn primary sm" data-act="saveExercise">Save</button></header>
    <div class="body pad"><label class="col"><span class="label">Name</span><input class="txt" id="nx-name" value="${esc(o.name)}" data-in="newex" data-k="name" placeholder="e.g. Landmine Press"></label>
    <label class="col"><span class="label">Main muscle</span>${sel('nx-muscle', MUSCLES.map(m => [m,m]), o.muscle)}</label>
    <label class="col"><span class="label">Equipment</span>${sel('nx-equip', EQUIP.map(m => [m,m]), o.equip)}</label>
    <label class="col"><span class="label">Logged as</span>${sel('nx-type', [['wr','Weight and reps'],['bw','Reps only'],['dur','Time'],['cardio','Distance and time']], o.kind)}</label>
    <span class="small" style="color:var(--bad)" id="nx-err"></span></div></div>`;
}
function plateMath(o){
  const lb = unit()==='lb', sizes = lb ? [45,35,25,10,5,2.5] : [25,20,15,10,5,2.5,1.25];
  let side = (o.target - o.bar)/2; const out = [];
  if (!(side > 0)) return {out, left:0, ok:o.target === o.bar};
  for (const p of sizes) while (side >= p - 1e-9){ out.push(p); side -= p; }
  return {out, left:+(side*2).toFixed(2), ok:true};
}
function ovPlates(o){
  const barOpts = unit()==='lb' ? [45,35,15] : [20,15,10];
  return `<div class="overlay"><header class="pad"><button class="btn sm" data-act="back">‹ Back</button><span class="title">Plate calculator</span></header>
    <div class="body pad"><label class="col"><span class="label">Target weight (${unit()})</span><input class="txt" id="pl-target" inputmode="decimal" value="${o.target}" data-in="plates"></label>
    <div class="row"><span class="label">Bar</span>${barOpts.map(b => `<button class="chip" aria-pressed="${o.bar===b}" data-act="plateBar" data-b="${b}">${b} ${unit()}</button>`).join('')}</div>
    <div id="pl-out" class="col">${platesOut(o)}</div></div></div>`;
}
function platesOut(o){
  const lb = unit()==='lb', m = plateMath(o);
  const look = p => { const kg = lb ? p/KG : p; const h = Math.max(34, Math.min(110, 34 + kg*3.2)), w = kg >= 9 ? 16 : 10;
    const c = lb ? (p>=45?'--p20':p>=35?'--p15':p>=25?'--p10':p>=10?'--p5':'--psm') : (p===25?'--p25':p===20?'--p20':p===15?'--p15':p===10?'--p10':p===5?'--p5':'--psm');
    return `<i style="height:${h}px;width:${w}px;background:var(${c})"></i>`; };
  if (!m.out.length) return `<div class="empty">${o.target < o.bar ? 'The target is lighter than the bar.' : 'Just the bar.'}</div>`;
  const counts = {}; m.out.forEach(p => counts[p] = (counts[p]||0)+1);
  return `<div class="card col"><div class="plates">${m.out.slice().reverse().map(look).join('')}<i class="shaft"></i>${m.out.map(look).join('')}</div>
    <span class="label">Each side</span><b style="font:700 24px var(--display)">${Object.entries(counts).sort((a,b) => b[0]-a[0]).map(([p,n]) => `${n} × ${p}`).join('  +  ')}</b>
    ${m.left ? `<span class="small muted">${m.left} ${unit()} short of the target with standard plates.</span>` : ''}</div>`;
}

function render(){
  const o = top();
  const view = {log:viewLog, train:viewTrain, exercises:viewExercises, progress:viewProgress}[ui.tab]();
  const overlay = !o ? '' : o.type==='active' ? ovActive() : o.type==='picker' ? ovPicker(o) : o.type==='routine' ? ovRoutine() : o.type==='workout' ? ovWorkout(o)
    : o.type==='summary' ? ovSummary(o) : o.type==='exercise' ? ovExercise(o) : o.type==='newex' ? ovNewEx(o) : o.type==='plates' ? ovPlates(o) : '';
  const a = state.active;
  const live = a && !ui.stack.some(s => s.type==='active') ? `<button class="bar live pad" data-act="resume"><span class="grow"><span class="small muted">Workout in progress</span><br><b>${esc(a.name)}</b></span><span class="btn primary sm"><span id="elapsed">${clock((Date.now()-a.start)/1000)}</span></span></button>` : '';
  const sh = ui.sheet ? `<div class="scrim" data-act="sheetClose"><div class="sheet pad" role="dialog" aria-label="${esc(ui.sheet.title)}"><span class="label">${esc(ui.sheet.title)}</span>${ui.sheet.items.map((it,i) => `<button class="btn ${it.danger?'danger':''}" data-act="sheetPick" data-i="${i}">${esc(it.label)}</button>`).join('')}</div></div>` : '';
  const tabs = [['log','Log'],['train','Train'],['exercises','Exercises'],['progress','Progress']];
  const main = document.querySelector('main'), keep = main && !overlay ? main.scrollTop : 0, body = document.querySelector('.overlay .body'), keepO = body ? body.scrollTop : 0, prevType = document.querySelector('.overlay')?.dataset.t;
  document.getElementById('app').innerHTML = `<main class="pad">${view}</main>${overlay ? '' : restBar()}${live}<nav class="tabs">${tabs.map(([k,l]) => `<button data-act="tab" data-tab="${k}" ${ui.tab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>${overlay}${sh}`;
  const ov = document.querySelector('.overlay'); if (ov){ ov.dataset.t = o.type; if (prevType === o.type) ov.querySelector('.body').scrollTop = keepO; }
  if (main && !overlay) document.querySelector('main').scrollTop = ui.keepMain ?? keep;
  ui.keepMain = null;
}

/* ---------- actions ---------- */
const exList = ctx => ctx === 'a' ? state.active.exercises : ui.draft.exercises;
const touch = ctx => { if (ctx === 'a') persist('active'); };
const REST_OPTS = [0,30,45,60,90,120,150,180,240,300];
const A = {
  tab(el){ ui.tab = el.dataset.tab; ui.stack = []; ui.keepMain = 0; try { history.replaceState(null,'','#'+ui.tab); } catch(e){} },
  back(){ ui.stack.pop(); },
  closeAll(){ ui.stack = []; },
  resume(){ ui.stack = [{type:'active'}]; },
  minimize(){ ui.stack = []; },
  startEmpty(){ startWorkout(null); return false; },
  startRoutine(el){ startWorkout(state.routines.find(r => r.id === el.dataset.id)); return false; },
  finish(){ finishWorkout(); return false; },
  discard(){ confirmSheet('Discard this workout? Nothing from it will be saved.', 'Discard workout', discard); return false; },
  openWorkout(el){ ui.stack.push({type:'workout', id:el.dataset.id}); },
  openExercise(el){ ui.stack.push({type:'exercise', id:el.dataset.id}); },
  muscle(el){ ui.muscle = el.dataset.m; },
  newExercise(){ ui.stack.push({type:'newex', name:ui.q, muscle:ui.muscle || 'Chest', equip:'Barbell', kind:'wr'}); },
  saveExercise(){
    const o = top(), name = o.name.trim();
    if (!name){ document.getElementById('nx-err').textContent = 'Give the exercise a name.'; return false; }
    if (Object.values(EX).some(x => x.name.toLowerCase() === name.toLowerCase())){ document.getElementById('nx-err').textContent = 'An exercise with that name already exists.'; return false; }
    const c = {id:'c_'+uid(), name, muscle:o.muscle, equip:o.equip, type:o.kind};
    state.custom.push(c); rebuildEX(); persist('settings'); ui.stack.pop(); ui.q = '';
    const p = top(); if (p?.type === 'picker') p.sel.push(c.id);
  },
  delExercise(el){ confirmSheet('Delete this custom exercise? Past workouts keep their sets but lose its name.', 'Delete exercise', () => {
    state.custom = state.custom.filter(c => c.id !== el.dataset.id); rebuildEX(); persist('settings'); ui.stack.pop(); }); return false; },
  addExercise(el){ ui.q = ''; ui.muscle = ''; ui.stack.push({type:'picker', ctx:el.dataset.ctx, sel:[]}); },
  pick(el){ const s = top().sel, i = s.indexOf(el.dataset.id); i < 0 ? s.push(el.dataset.id) : s.splice(i,1); },
  pickDone(){
    const o = ui.stack.pop(), list = exList(o.ctx);
    o.sel.forEach(id => { const prev = o.ctx === 'a' ? lastSets(id) : null;
      list.push({exId:id, note:'', rest:null, sets: prev ? prev.map(s => ({...newSet(), type:s.type})) : [newSet()]}); });
    touch(o.ctx); ui.q = ''; ui.muscle = '';
  },
  addSet(el){ const e = exList(el.dataset.ctx)[+el.dataset.ei], l = e.sets[e.sets.length-1]; e.sets.push(el.dataset.ctx === 'r' ? newSet(l) : newSet()); touch(el.dataset.ctx); },
  rmSet(el){ exList(el.dataset.ctx)[+el.dataset.ei].sets.splice(+el.dataset.si, 1); touch(el.dataset.ctx); },
  setMenu(el){
    const ctx = el.dataset.ctx, e = exList(ctx)[+el.dataset.ei], s = e.sets[+el.dataset.si];
    const set = t => () => { s.type = t; touch(ctx); };
    sheet('Set type', [{label:'Normal set', fn:set('N')},{label:'W · Warm-up (not counted in volume or records)', fn:set('W')},{label:'D · Drop set', fn:set('D')},{label:'F · To failure', fn:set('F')},
      {label:'Remove this set', danger:true, fn(){ e.sets.splice(+el.dataset.si,1); touch(ctx); }}]); return false; },
  exMenu(el){
    const ctx = el.dataset.ctx, list = exList(ctx), i = +el.dataset.ei;
    const mv = d => () => { const [x] = list.splice(i,1); list.splice(i+d,0,x); touch(ctx); };
    sheet(EX[list[i].exId]?.name || 'Exercise', [...(i > 0 ? [{label:'Move up', fn:mv(-1)}] : []), ...(i < list.length-1 ? [{label:'Move down', fn:mv(1)}] : []),
      {label:'Remove exercise', danger:true, fn(){ list.splice(i,1); touch(ctx); }}]); return false; },
  restMenu(el){
    const ctx = el.dataset.ctx, e = exList(ctx)[+el.dataset.ei];
    sheet('Rest after each set', REST_OPTS.map(s => ({label:s ? clock(s) : 'Off', fn(){ e.rest = s; touch(ctx); }}))); return false; },
  defRest(){ sheet('Default rest timer', REST_OPTS.map(s => ({label:s ? clock(s) : 'Off', fn(){ state.settings.rest = s; persist('settings'); }}))); return false; },
  fillPrev(el){ const e = state.active.exercises[+el.dataset.ei], p = lastSets(e.exId)?.[+el.dataset.si]; if (p){ Object.assign(e.sets[+el.dataset.si], {w:p.w ?? null, r:p.r ?? null, t:p.t ?? null, d:p.d ?? null}); persist('active'); } },
  done(el){
    const e = state.active.exercises[+el.dataset.ei], s = e.sets[+el.dataset.si], x = EX[e.exId];
    if (s.done){ s.done = false; persist('active'); return; }
    const p = lastSets(e.exId)?.[+el.dataset.si], need = {wr:['w','r'], bw:['r'], dur:['t'], cardio:['d','t']}[x.type];
    need.forEach(k => { if (s[k] == null && p && p[k] != null) s[k] = p[k]; });
    const ok = x.type === 'wr' ? s.r != null : x.type === 'cardio' ? (s.d != null || s.t != null) : need.every(k => s[k] != null);
    if (!ok){ const row = el.closest('.set'); row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); return false; }
    if (x.type === 'wr' && s.w == null) s.w = 0;
    s.done = true; startRest(e.rest ?? state.settings.rest); persist('active');
  },
  restAdj(el){ if (ui.rest){ ui.rest.end += (+el.dataset.d)*1000; if (ui.rest.end <= Date.now()) ui.rest = null; } },
  restSkip(){ ui.rest = null; },
  newRoutine(){ ui.draft = {id:uid(), name:'', exercises:[], isNew:true}; ui.stack.push({type:'routine'}); },
  routineMenu(el){
    const r = state.routines.find(r => r.id === el.dataset.id);
    sheet(r.name, [{label:'Edit routine', fn(){ ui.draft = JSON.parse(JSON.stringify(r)); ui.stack.push({type:'routine'}); }},
      {label:'Duplicate', fn(){ state.routines.push({...JSON.parse(JSON.stringify(r)), id:uid(), name:r.name + ' copy'}); persist('routines'); }},
      {label:'Delete routine', danger:true, fn(){ state.routines = state.routines.filter(x => x.id !== r.id); persist('routines'); }}]); return false; },
  saveRoutine(){
    const {isNew, ...r} = ui.draft; r.name = r.name.trim() || 'Untitled routine';
    const i = state.routines.findIndex(x => x.id === r.id); i < 0 ? state.routines.push(r) : state.routines[i] = r;
    persist('routines'); ui.stack.pop(); ui.tab = 'train';
  },
  workoutMenu(el){
    const w = state.workouts.find(w => w.id === el.dataset.id);
    sheet(w.name, [{label:'Do this workout again', fn(){ startWorkout(w); }}, {label:'Save as a routine', fn(){ A.saveAsRoutine(el); }},
      {label:'Delete workout', danger:true, fn(){ state.workouts = state.workouts.filter(x => x.id !== w.id); persist(monthKey(w.start)); ui.stack.pop(); }}]); return false; },
  saveAsRoutine(el){
    const w = state.workouts.find(w => w.id === el.dataset.id);
    state.routines.push({id:uid(), name:w.name, exercises:w.exercises.map(e => ({exId:e.exId, rest:e.rest ?? null, sets:e.sets.map(s => ({type:s.type, w:s.w ?? null, r:s.r ?? null, t:s.t ?? null, d:s.d ?? null}))}))});
    persist('routines'); ui.stack = []; ui.tab = 'train';
  },
  updateRoutine(el){
    const w = state.workouts.find(w => w.id === el.dataset.id), r = state.routines.find(r => r.id === el.dataset.rid);
    r.exercises = w.exercises.map(e => ({exId:e.exId, rest:e.rest ?? null, sets:e.sets.map(s => ({type:s.type, w:s.w ?? null, r:s.r ?? null, t:s.t ?? null, d:s.d ?? null}))}));
    persist('routines'); ui.stack = []; ui.tab = 'train';
  },
  unit(el){ state.settings.unit = el.dataset.u; persist('settings'); },
  cal(el){ ui.cal = new Date(ui.cal.getFullYear(), ui.cal.getMonth() + (+el.dataset.d), 1); },
  plates(){ ui.stack.push({type:'plates', target:unit()==='lb' ? 225 : 100, bar:unit()==='lb' ? 45 : 20}); },
  plateBar(el){ top().bar = +el.dataset.b; },
  exportData(){
    const t = document.getElementById('backup'), msg = document.getElementById('backupmsg');
    t.value = JSON.stringify({app:'chalk-log', v:1, ...state, active:null}); t.select();
    const ok = () => msg.textContent = 'Backup copied. Paste it somewhere safe.', no = () => msg.textContent = 'Backup is selected above. Copy it and keep it somewhere safe.';
    try { navigator.clipboard.writeText(t.value).then(ok, no); } catch(e){ no(); }
    return false; },
  importData(){
    const t = document.getElementById('backup'), msg = document.getElementById('backupmsg'); let data;
    try { data = JSON.parse(t.value); if (!data || !Array.isArray(data.workouts)) throw 0; } catch(e){ msg.textContent = 'That text is not a Chalk Log backup. Paste the full backup and try again.'; return false; }
    confirmSheet(`Replace everything here with this backup of ${data.workouts.length} workouts?`, 'Replace my log', () => {
      const old = new Set(state.workouts.map(w => monthKey(w.start)));
      const {app, v, ...rest} = data; state = normalize({...rest, active:state.active}); rebuildEX();
      persist('settings','routines', ...old, ...state.workouts.map(w => monthKey(w.start)));
    }); return false; },
  sheetPick(el){ const it = ui.sheet.items[+el.dataset.i]; ui.sheet = null; it.fn(); },
  sheetClose(el, ev){ if (ev.target !== el) return false; ui.sheet = null; },
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (fn(el, ev) !== false) render();
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset.in; if (!k) return;
  if (k === 'set'){
    const s = exList(el.dataset.ctx)[+el.dataset.ei].sets[+el.dataset.si], f = el.dataset.k, v = el.value.trim().replace(',', '.');
    const n = parseFloat(v);
    s[f] = v === '' ? null : f === 't' ? parseT(v) : isNaN(n) ? null : f === 'w' ? wk(n) : f === 'd' ? dk(n) : Math.round(n);
    touch(el.dataset.ctx);
  } else if (k === 'note'){ state.active.exercises[+el.dataset.ei].note = el.value; persist('active'); }
  else if (k === 'wname'){ state.active.name = el.value; persist('active'); }
  else if (k === 'rname'){ ui.draft.name = el.value; }
  else if (k === 'search'){ ui.q = el.value; const o = top(); document.getElementById('exlist').innerHTML = exRows(o?.type === 'picker' ? o.sel : null); }
  else if (k === 'newex'){ top()[el.dataset.k] = el.value; }
  else if (k === 'plates'){ top().target = parseFloat(el.value.replace(',', '.')) || 0; document.getElementById('pl-out').innerHTML = platesOut(top()); }
});
document.addEventListener('change', ev => { const el = ev.target; if (el.dataset.in === 'set' && el.dataset.k === 't'){ const s = exList(el.dataset.ctx)[+el.dataset.ei].sets[+el.dataset.si]; if (s.t != null) el.value = clock(s.t); } });

/* ---------- boot ---------- */
const local = loadLocal();
if (local) state = local; else { state.routines = starter(); }
rebuildEX();
const h = (location.hash || '').slice(1); if (['log','train','exercises','progress'].includes(h)) ui.tab = h;
if (state.active) ui.stack = [];
render();
connect();
})();
</script>
